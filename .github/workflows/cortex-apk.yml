# Cortex Workspace : construit l'APK de test a chaque envoi sur la branche cortex.
name: "Cortex Workspace - APK"

on:
  push:
    branches: [ cortex ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Construire l'APK de test (saveur generic, signature de debogage)
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          ./gradlew assembleGenericDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-workspace-apk-test
          path: app/build/outputs/apk/generic/debug/*.apk
